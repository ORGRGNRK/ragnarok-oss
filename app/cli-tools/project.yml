name: CLITools
options:
  bundleIdPrefix: co.rgnrk
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  CLITools:
    type: application
    platform: macOS
    sources:
      - path: CLITools
    info:
      path: CLITools/Info.plist
      properties:
        CFBundleDisplayName: CLI Tools
        CFBundleName: CLI Tools
        LSApplicationCategoryType: public.app-category.developer-tools
        NSAppleEventsUsageDescription: CLI Tools saves lookup results to Notes when you choose Save.
        NSServices:
          - NSMenuItem:
              default: Find CLI Tool
            NSMessage: findCLITool
            NSPortName: CLI Tools
            NSSendTypes:
              - public.utf8-plain-text
              - NSStringPboardType
            NSRequiredContext: {}
    entitlements:
      path: CLITools/CLITools.entitlements
      properties:
        # Off so the pipeline's shell script can run /bin/zsh, man, whatis and friends.
        com.apple.security.app-sandbox: false
        com.apple.security.automation.apple-events: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: co.rgnrk.CLITools
        PRODUCT_NAME: CLI Tools
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        COMBINE_HIDPI_IMAGES: YES
