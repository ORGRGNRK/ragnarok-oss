name: RagnarokControls
options:
  deploymentTarget:
    macOS: "26.0"
targets:
  RagnarokControls:
    type: app-extension
    platform: macOS
    sources: [RagnarokControls.swift, Assets.xcassets, ../Sources/Heimdall/ControlIntents.swift]
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: co.rgnrk.heimdall.controls
      PRODUCT_NAME: RagnarokControls
      INFOPLIST_FILE: Info.plist
      CODE_SIGN_ENTITLEMENTS: Controls.entitlements
      SWIFT_VERSION: "5.0"
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: RAGNAROK_CONTROLS_EXTENSION
      MARKETING_VERSION: "0.1"
      CURRENT_PROJECT_VERSION: "1"
