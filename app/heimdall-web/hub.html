<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Heimdall Hub</title>
<link rel="stylesheet" href="style.css">
<style>
  main { flex:1; overflow-y:auto; padding:8px 16px 40px; }
  h2 { font-size:12px; letter-spacing:.15em; text-transform:uppercase; color:var(--gold); font-weight:400; margin:22px 0 4px; }
  .sub { color:var(--dim); font-size:12px; margin-bottom:10px; }
  .chips { display:flex; flex-wrap:wrap; gap:6px; margin:8px 0 12px; }
  .chip { font-size:11px; letter-spacing:.08em; text-transform:uppercase; padding:4px 9px; border:1px solid var(--line); border-radius:999px; color:var(--dim); cursor:pointer; background:transparent; }
  .chip.on { color:var(--gold); border-color:var(--gold); }
  .row { display:grid; grid-template-columns:minmax(9rem,16rem) 9.5rem 1fr; gap:4px 14px; padding:9px 0; border-top:1px solid var(--line); align-items:baseline; }
  .row .n { word-break:break-word; } .row .n small { color:var(--dim); display:block; font-size:11px; }
  .row .d { color:var(--dim); font-size:12px; word-break:break-word; }
  .b { font-size:11px; letter-spacing:.08em; text-transform:uppercase; }
  .b.ok { color:var(--dim); } .b.warn { color:var(--amber); } .b.bad { color:var(--red); }
  .cs { display:flex; flex-wrap:wrap; gap:6px; }
  .c { font-size:12px; border:1px solid var(--line); border-radius:4px; padding:3px 8px; color:var(--dim); }
  .c.bad { color:var(--red); border-color:var(--red); }
  @media (max-width: 700px) { .row { grid-template-columns:1fr auto; } .row .d { grid-column:1 / -1; } }
</style>
</head>
<body>
<script src="/splash.js"></script>
<script src="/lock.js"></script>
<header>
  <span class="mark">CLR — Rgnrk. <small>heimdall</small></span>
  <nav><a href="/">Chat</a><a href="/room">Room</a><a href="/agents">Agents</a><a href="/hub" aria-current="page">Hub</a><a href="/intake">Intake</a><a href="/timeline">Timeline</a><a href="/proved">Proved</a></nav>
  <span class="status"><span class="dot" id="dot"></span><span id="status">Looking at every project…</span></span>
</header>
<main id="main"></main>
<script>
const $ = id => document.getElementById(id);
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
const RISK = { "no git": "bad", "no remote": "bad", "branch not pushed": "bad", "unpushed commits": "warn", "uncommitted": "warn", "pushed": "ok", "empty": "ok" };
const SAY = { "no git": "not in git", "no remote": "not on GitHub", "branch not pushed": "branch not on GitHub", "unpushed commits": "commits not pushed", "uncommitted": "uncommitted changes", "pushed": "on GitHub", "empty": "empty folder" };
const filters = {};
let data = null;

function ago(sec) {
  const s = Math.max(0, Date.now() / 1000 - sec);
  return s < 90 ? "just now" : s < 5400 ? Math.round(s / 60) + " min ago" : s < 172800 ? Math.round(s / 3600) + " h ago" : Math.round(s / 86400) + " days ago";
}

function machine(box, key, title, m, live) {
  box.append(el("h2", null, title));
  if (!m) { box.append(el("div", "sub", "No snapshot yet. On the Mac run: ~/Developer/ragnarok/app/heimdall-web/publish-hub.sh")); return; }
  const real = m.projects.filter(p => !p.link);
  const atRisk = real.filter(p => RISK[p.backup] === "bad").length;
  box.append(el("div", "sub", (live ? "live" : "snapshot from " + ago(m.at)) + " · " + real.length + " projects · " + atRisk + " not on a git remote" +
    (m.containers ? " · " + m.containers.length + " containers, " + m.containers.filter(c => !c.healthy).length + " not healthy" : "")));
  if (m.containers) {
    const cs = el("div", "cs");
    for (const c of m.containers.slice().sort((a, b) => a.healthy - b.healthy || a.name.localeCompare(b.name))) {
      const e = el("span", "c" + (c.healthy ? "" : " bad"), c.name + (c.healthy ? "" : " · " + c.status)); e.title = c.status; cs.append(e);
    }
    box.append(cs);
  }
  const counts = {}; for (const p of real) counts[p.backup] = (counts[p.backup] || 0) + 1;
  const chips = el("div", "chips"), cur = filters[key] || "all";
  for (const k of ["all", "no git", "no remote", "branch not pushed", "unpushed commits", "uncommitted", "pushed", "empty"]) {
    if (k !== "all" && !counts[k]) continue;
    const c = el("button", "chip" + (cur === k ? " on" : ""), (k === "all" ? "all" : SAY[k]) + " " + (k === "all" ? real.length : counts[k]));
    c.onclick = () => { filters[key] = k; render(); }; chips.append(c);
  }
  box.append(chips);
  for (const p of real.filter(p => cur === "all" || p.backup === cur)) {
    const row = el("div", "row");
    const n = el("div", "n", p.name); n.append(el("small", null, (p.kinds || []).join(" · ") + (p.branch ? (p.kinds.length ? " · " : "") + p.branch : "")));
    const b = el("div", "b " + RISK[p.backup], SAY[p.backup] + (p.unpushed > 0 ? " (" + p.unpushed + ")" : "") + (p.backup === "uncommitted" ? " (" + p.dirty + ")" : ""));
    row.append(n, b, el("div", "d", [p.about, p.lastCommit, p.remote].filter(Boolean).join("  —  ")));
    box.append(row);
  }
}

function render() {
  const box = $("main"); box.textContent = "";
  machine(box, "here", "Alexus (" + data.here.host + ")", data.here, true);
  machine(box, "mac", "This Mac" + (data.mac ? " (" + data.mac.host + ")" : ""), data.mac, false);
}

async function load() {
  try {
    const r = await fetch("api/hub"); const d = await r.json();
    if (!r.ok) throw new Error(d.error);
    data = d; render();
    $("status").textContent = "Read-only view"; $("dot").className = "dot on";
  } catch (e) { $("status").textContent = e.message; $("dot").className = "dot err"; }
}
load(); setInterval(load, 60000);
</script>
</body>
</html>
