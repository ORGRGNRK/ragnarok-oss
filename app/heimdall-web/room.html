<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Heimdall Room</title>
<link rel="stylesheet" href="style.css">
<script src="gate.js"></script>
<style>
  .wrap { flex:1; display:flex; min-height:0; }
  #log { flex:1; }
  aside { width:22rem; border-left:1px solid var(--line); overflow-y:auto; padding:12px 16px; }
  aside h2 { font-size:12px; letter-spacing:.15em; text-transform:uppercase; color:var(--gold); margin:4px 0 12px; font-weight:400; }
  .task { border:1px solid var(--line); border-radius:6px; padding:8px 10px; margin-bottom:10px; }
  .task .meta { font-size:11px; color:var(--dim); letter-spacing:.08em; text-transform:uppercase; margin-bottom:4px; }
  .task .meta b { color:var(--amber); font-weight:400; }
  .task .text { white-space:pre-wrap; word-wrap:break-word; font-size:13px; }
  .task .acts { margin-top:6px; display:flex; gap:6px; }
  .task button { padding:4px 8px; font-size:11px; }
  .msg .who b { color:var(--gold); font-weight:400; }
  .msg.mine { align-self:flex-end; }
  .msg.mine .body { background:var(--panel); border:1px solid var(--line); padding:8px 12px; border-radius:6px; }
  .msg.task-msg .body { border-left:2px solid var(--amber); padding-left:10px; }
  .kind { display:flex; gap:6px; align-items:center; color:var(--dim); font-size:12px; }
  @media (max-width: 760px) { .wrap { flex-direction:column; } aside { width:auto; border-left:0; border-top:1px solid var(--line); max-height:35vh; } }
</style>
</head>
<body>
<script src="/splash.js"></script>
<script src="/lock.js"></script>
<header>
  <span class="mark">CLR — Rgnrk. <small>heimdall</small></span>
  <nav><a href="/">Chat</a><a href="/room" aria-current="page">Room</a><a href="/agents">Agents</a><a href="/hub">Hub</a><a href="/intake">Intake</a><a href="/timeline">Timeline</a><a href="/proved">Proved</a></nav>
  <span class="status"><span class="dot" id="dot"></span><span id="status">Loading the room…</span></span>
</header>
<div class="wrap">
  <main id="log"></main>
  <aside><h2>Open tasks</h2><div id="tasks"><div class="note">Loading…</div></div></aside>
</div>
<form id="form">
  <textarea id="text" placeholder="Post to the room (you show as owner)" aria-label="Message"></textarea>
  <label class="kind"><input type="checkbox" id="asTask"> task</label>
  <button id="send">Post</button>
</form>
<script>
const $ = id => document.getElementById(id);
const seen = new Set();
let first = true;

function setStatus(text, state) { $("status").textContent = text; $("dot").className = "dot " + (state || ""); }
function when(ts) {
  const d = new Date(ts); if (isNaN(d)) return "";
  const same = d.toDateString() === new Date().toDateString();
  return same ? d.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" })
              : d.toLocaleString([], { month: "short", day: "numeric", hour: "numeric", minute: "2-digit" });
}
function render(m) {
  const el = document.createElement("div");
  el.className = "msg" + (m.by === "owner" ? " mine" : "") + (m.type === "task" ? " task-msg" : "");
  const who = document.createElement("div"); who.className = "who";
  const b = document.createElement("b"); b.textContent = m.by || "?";
  const label = m.type === "task" ? " · task " + m.id : m.type && m.type !== "say" ? " · " + m.type + (m.ref ? " " + m.ref : "") : "";
  who.append(b, document.createTextNode(label + " · " + when(m.ts) + (m.unverified ? " · UNVERIFIED" : "")));
  const body = document.createElement("div"); body.className = "body";
  body.textContent = m.text || "";
  if (!m.text) body.style.display = "none";
  el.append(who, body);
  return el;
}

async function loadMessages() {
  try {
    const r = await fetch("api/room/read?n=" + (first ? 80 : 30)); const d = await r.json();
    if (!r.ok) throw new Error(d.error);
    const log = $("log"), atBottom = log.scrollHeight - log.scrollTop - log.clientHeight < 80;
    let added = 0;
    for (const m of d.items) {
      const key = m.id + ":" + m.ts;
      if (seen.has(key)) continue;
      seen.add(key); log.append(render(m)); added++;
    }
    if (first || (added && atBottom)) log.scrollTop = log.scrollHeight;
    first = false;
    setStatus("Live · updates every 4 s", "on");
  } catch (e) { setStatus("Can't read the room: " + e.message, "err"); }
}

async function act(verb, id, note) {
  let gate; try { gate = await touch("room:" + verb); } catch (e) { setStatus(verb + " needs a YubiKey touch: " + e.message, "err"); return; }
  const r = await fetch("api/room/" + verb, { method: "POST", body: JSON.stringify({ id, text: note || "", gate }) });
  const d = await r.json();
  if (!r.ok) { setStatus(verb + " failed: " + d.error, "err"); return; }
  loadTasks(); loadMessages();
}

async function loadTasks() {
  try {
    const r = await fetch("api/room/tasks"); const d = await r.json();
    if (!r.ok) throw new Error(d.error);
    const box = $("tasks"); box.textContent = "";
    if (!d.items.length) { box.innerHTML = '<div class="note">No open tasks.</div>'; return; }
    for (const t of d.items.slice().reverse()) {
      const el = document.createElement("div"); el.className = "task";
      const meta = document.createElement("div"); meta.className = "meta";
      const st = document.createElement("b"); st.textContent = t.state + (t.owner ? " by " + t.owner : "");
      meta.append(document.createTextNode(t.id + " · " + when(t.ts) + " · "), st);
      const text = document.createElement("div"); text.className = "text"; text.textContent = t.text;
      const acts = document.createElement("div"); acts.className = "acts";
      if (t.state !== "claimed" || t.owner !== "owner") {
        const c = document.createElement("button"); c.className = "quiet"; c.textContent = "Claim";
        c.onclick = () => act("claim", t.id); acts.append(c);
      }
      const done = document.createElement("button"); done.className = "quiet"; done.textContent = "Done";
      done.onclick = () => { const note = prompt("Mark " + t.id + " done. Note (optional):", ""); if (note !== null) act("done", t.id, note); };
      acts.append(done);
      el.append(meta, text, acts); box.append(el);
    }
  } catch (e) { $("tasks").innerHTML = ""; const n = document.createElement("div"); n.className = "note"; n.textContent = e.message; $("tasks").append(n); }
}

$("form").onsubmit = async ev => {
  ev.preventDefault();
  const t = $("text").value.trim(); if (!t) return;
  const verb = $("asTask").checked ? "task" : "say";
  $("send").disabled = true;
  try {
    const gate = await touch("room:" + verb);
    const r = await fetch("api/room/" + verb, { method: "POST", body: JSON.stringify({ text: t, gate }) });
    const d = await r.json();
    if (!r.ok) throw new Error(d.error);
    $("text").value = ""; $("asTask").checked = false;
    await loadMessages(); if (verb === "task") loadTasks();
    $("log").scrollTop = $("log").scrollHeight;
  } catch (e) { setStatus("Post failed: " + e.message, "err"); }
  $("send").disabled = false;
};
$("text").addEventListener("keydown", ev => {
  if (ev.key === "Enter" && !ev.shiftKey && !ev.isComposing) { ev.preventDefault(); $("form").requestSubmit(); }
});

loadMessages(); loadTasks();
setInterval(loadMessages, 4000); setInterval(loadTasks, 15000);
</script>
</body>
</html>
