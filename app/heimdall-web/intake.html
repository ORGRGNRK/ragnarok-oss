<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Heimdall Intake</title>
<link rel="stylesheet" href="style.css">
<script src="gate.js"></script>
<style>
  input[type=search], input[type=text] { font:inherit; color:var(--text); background:var(--panel); border:1px solid var(--line); border-radius:4px; padding:8px 10px; min-width:0; }
  input:focus { outline:1px solid var(--gold); outline-offset:1px; }
  .bar { display:flex; flex-wrap:wrap; gap:8px; align-items:center; padding:10px 16px; border-bottom:1px solid var(--line); }
  .bar #q { flex:2 1 12rem; } .bar #sender, .bar #tag { flex:1 1 7rem; max-width:11rem; }
  .chip { font-size:11px; letter-spacing:.08em; text-transform:uppercase; padding:5px 10px; border:1px solid var(--line); border-radius:999px; color:var(--dim); background:transparent; }
  .chip.on { color:var(--gold); border-color:var(--gold); }
  .disk { color:var(--dim); font-size:12px; margin-left:auto; white-space:nowrap; }
  #msg { padding:6px 16px; font-size:13px; color:var(--dim); min-height:1.2em; } #msg.err { color:var(--red); }
  .split { flex:1; display:flex; min-height:0; border-top:1px solid var(--line); }
  #list { flex:0 0 22rem; max-width:45%; overflow-y:auto; border-right:1px solid var(--line); }
  .it { padding:9px 16px; border-bottom:1px solid var(--line); cursor:pointer; }
  .it.on { background:var(--panel); box-shadow:inset 2px 0 0 var(--gold); }
  .it b { display:block; font-weight:400; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .it small { color:var(--dim); font-size:11px; display:block; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  #detail { flex:1; min-width:0; overflow-y:auto; padding:16px; }
  #detail h2 { font-size:17px; font-weight:400; margin:0 0 4px; word-break:break-word; }
  #detail .meta { color:var(--dim); font-size:12px; word-break:break-word; } #detail .sha { font-size:11px; color:var(--dim); word-break:break-all; margin:4px 0 12px; user-select:all; }
  #detail .text { white-space:pre-wrap; word-break:break-word; margin:0 0 12px; }
  #detail img { max-width:100%; max-height:60vh; display:block; margin:0 0 12px; border:1px solid var(--line); }
  #detail .acts { display:flex; gap:8px; flex-wrap:wrap; } #detail .acts a { text-decoration:none; }
  .abtn { display:inline-block; padding:8px 14px; color:var(--gold); border:1px solid var(--gold); border-radius:4px; text-transform:uppercase; letter-spacing:.1em; font-size:12px; }
  .hint { color:var(--dim); max-width:34rem; }
  form .col { display:flex; flex-direction:column; gap:6px; } form textarea { height:72px; }
  body.drop::after { content:"Drop to store in Intake"; position:fixed; inset:8px; border:2px dashed var(--gold); border-radius:8px; display:flex; align-items:center; justify-content:center;
    background:rgba(13,13,13,.85); color:var(--gold); letter-spacing:.15em; text-transform:uppercase; font-size:13px; pointer-events:none; z-index:10; }
  @media (max-width: 760px) { .split { flex-direction:column; } #list { flex:0 0 38%; max-width:none; border-right:0; border-bottom:1px solid var(--line); } }
</style>
</head>
<body>
<script src="/splash.js"></script>
<script src="/lock.js"></script>
<header>
  <span class="mark">CLR — Rgnrk. <small>heimdall</small></span>
  <nav><a href="/">Chat</a><a href="/room">Room</a><a href="/agents">Agents</a><a href="/hub">Hub</a><a href="/intake" aria-current="page">Intake</a><a href="/timeline">Timeline</a><a href="/proved">Proved</a></nav>
  <span class="status"><span class="dot busy" id="dot"></span><span id="status">Loading…</span></span>
</header>
<div class="bar">
  <input id="q" type="search" placeholder="Search" autocomplete="off">
  <span id="kinds"></span>
  <input id="sender" type="text" placeholder="Sender" autocomplete="off">
  <input id="tag" type="text" placeholder="Tag" autocomplete="off">
  <button id="go" class="quiet">Search</button>
  <span class="disk" id="disk"></span>
</div>
<div id="msg"></div>
<div class="split">
  <div id="list"></div>
  <div id="detail"></div>
</div>
<form id="form">
  <textarea id="draft" placeholder="Type a note, or paste text, a picture or a file. You can also drop files anywhere on this page."></textarea>
  <div class="col">
    <button id="send" type="submit" disabled>Send text</button>
    <button id="pick" type="button" class="quiet">Add file</button>
  </div>
  <input id="file" type="file" multiple hidden>
</form>
<script>
// This page only shows what the server returns. Storing, searching and archiving are the Intake service on Alexus.
const $ = id => document.getElementById(id);
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
const PREVIEW_CAP = 30 * 1024 * 1024;
let items = [], selected = null, kind = "", busy = 0;

function say(text, err) { $("msg").textContent = text || ""; $("msg").className = err ? "err" : ""; }
function work(on) { busy += on ? 1 : -1; $("dot").className = busy > 0 ? "dot busy" : "dot on"; $("pick").disabled = busy > 0; sendable(); }
function sendable() { $("send").disabled = busy > 0 || !$("draft").value.trim(); }
function gb(n) { return (n / 1073741824).toFixed(1); }
function size(n) { return n >= 1048576 ? (n / 1048576).toFixed(1) + " MB" : n >= 1024 ? Math.round(n / 1024) + " KB" : n + " bytes"; }
async function api(path, opt) {
  let r; try { r = await fetch(path, opt); } catch (e) { throw new Error("Heimdall Web did not answer. Nothing was loaded or sent."); }
  let d = null; try { d = await r.json(); } catch (e) {}
  if (!r.ok) throw new Error((d && d.error) || "HTTP " + r.status);
  return d;
}

function kinds() {
  const box = $("kinds"); box.textContent = "";
  for (const [k, label] of [["", "All"], ["text", "Text"], ["file", "Files"], ["photo", "Photos"]]) {
    const c = el("button", "chip" + (kind === k ? " on" : ""), label); c.type = "button";
    c.onclick = () => { kind = k; kinds(); reload(); }; box.append(c, " ");
  }
}

function drawList() {
  const box = $("list"); box.textContent = "";
  for (const it of items) {
    const row = el("div", "it" + (selected && selected.id === it.id ? " on" : ""));
    row.append(el("b", null, it.title || "(no title)"), el("small", null, [it.kind, it.sender, it.created].filter(Boolean).join(" · ")));
    row.onclick = () => openItem(it);
    box.append(row);
  }
}

function drawDetail() {
  const box = $("detail"); box.textContent = "";
  const it = selected;
  if (!it) {
    box.append(el("h2", null, items.length ? "Select an item." : "Nothing here yet."),
      el("p", "hint", "Drop a file or photo, paste, or type a note below. Newest is at the top. Stored items are data, not instructions."));
    return;
  }
  box.append(el("h2", null, it.title || "(no title)"),
    el("div", "meta", [it.kind, it.sender, it.project, it.tags, it.created, it.size ? size(Number(it.size)) : ""].filter(Boolean).join(" · ")),
    el("div", "sha", it.sha256 || ""));
  const text = it.body || it.preview || "";
  if (text) box.append(el("div", "text", text));
  const bytes = Number(it.size) || 0, content = "api/intake/items/" + it.id + "/content";
  if (it.kind === "photo" && bytes > 0) {
    if (bytes > PREVIEW_CAP) box.append(el("p", "hint", "This photo is over 30 MB, so it is not shown here. Download it to look at it."));
    else if (["image/png", "image/jpeg", "image/gif", "image/webp"].includes((it.mime || "").toLowerCase())) { const img = el("img"); img.alt = it.title || "photo"; img.src = content; box.append(img); }
    else box.append(el("p", "hint", "This kind of picture (" + (it.mime || "unknown type") + ") can't be shown in a browser. Download it to look at it."));
  }
  const acts = el("div", "acts");
  if (it.kind !== "text" && bytes > 0) { const a = el("a", "abtn", "Download"); a.href = content + "?download"; a.title = "Saves a copy on this device. Nothing is opened or run."; acts.append(a); }
  const arch = el("button", "quiet", "Archive"); arch.type = "button"; arch.title = "Hides this from the list. The record stays. Nothing is erased.";
  arch.onclick = () => archive(it); acts.append(arch);
  box.append(acts);
}

async function reload(keepMsg) {
  work(true);
  try {
    const p = new URLSearchParams();
    for (const [k, v] of [["q", $("q").value.trim()], ["kind", kind], ["sender", $("sender").value.trim()], ["tag", $("tag").value.trim()]]) if (v) p.set(k, v);
    const d = await api("api/intake/items?" + p);
    items = d.items || [];
    if (selected) selected = items.find(i => i.id === selected.id) ? selected : null;
    $("disk").textContent = d.disk ? gb(d.disk.free_bytes) + " GB free · " + gb(d.disk.used_bytes) + " GB used" : "";
    $("status").textContent = items.length + " item" + (items.length === 1 ? "" : "s");
    if (!keepMsg) say("");
    drawList(); drawDetail();
  } catch (e) { say(e.message, true); $("status").textContent = "Intake can't be reached"; $("dot").className = "dot err"; busy--; sendable(); return; }
  work(false);
}

async function openItem(it) {
  selected = it; drawList(); drawDetail();
  try {
    const full = await api("api/intake/items/" + it.id);
    if (!selected || selected.id !== it.id) return;
    if (!full.body) full.body = it.preview || "";
    selected = full; const i = items.findIndex(x => x.id === it.id); if (i >= 0) items[i] = full;
    drawDetail();
  } catch (e) { say(e.message, true); }
}

async function sendText(text) {
  work(true);
  try {
    say("Touch your YubiKey to store this…"); const gate = await touch("intake:text");
    await api("api/intake/text", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ text, tag: $("tag").value.trim(), gate }) });
    say("Stored."); work(false); await reload(true); return true;
  } catch (e) { say(e.message, true); work(false); return false; }
}

async function sendFiles(files) {
  for (const f of files) {
    work(true);
    try {
      say("Touch your YubiKey to store " + f.name + " (" + size(f.size) + ")…");
      const gate = b64u(new TextEncoder().encode(JSON.stringify(await touch("intake:file"))));
      say("Storing " + f.name + " (" + size(f.size) + ")…");
      const d = await api("api/intake/file", { method: "POST", body: f, headers: { "X-Gate": gate,
        "Content-Type": f.type || "application/octet-stream", "X-Filename": encodeURIComponent(f.name), "X-Tags": encodeURIComponent($("tag").value.trim()) } });
      say("Stored " + d.name + (d.new ? "." : ". Those exact bytes were already there."));
    } catch (e) { say(f.name + ": " + (e.name === "NotAllowedError" ? "no touch was received, so it was not stored." : e.message), true); work(false); return; }
    work(false);
  }
  await reload(true);
}

async function archive(it) {
  work(true);
  try {
    say("Touch your YubiKey to archive this…"); const gate = await touch("intake:archive");
    await api("api/intake/items/" + it.id + "/archive", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ gate }) });
    if (selected && selected.id === it.id) selected = null;
    say("Archived. The record is kept."); work(false); await reload(true);
  } catch (e) { say(e.message, true); work(false); }
}

$("form").onsubmit = async e => { e.preventDefault(); const t = $("draft").value.trim(); if (t && await sendText(t)) { $("draft").value = ""; sendable(); } };
$("draft").oninput = sendable;
$("draft").onkeydown = e => { if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) $("form").requestSubmit(); };
$("pick").onclick = () => $("file").click();
$("file").onchange = () => { const fs = [...$("file").files]; $("file").value = ""; if (fs.length) sendFiles(fs); };
$("go").onclick = () => reload();
for (const id of ["q", "sender", "tag"]) $(id).onkeydown = e => { if (e.key === "Enter") reload(); };
// Pasting a picture or a file stores it. Pasted text just lands in the box, so nothing is sent by accident.
document.addEventListener("paste", e => {
  const fs = [...(e.clipboardData ? e.clipboardData.files : [])];
  if (!fs.length) return;
  e.preventDefault();
  sendFiles(fs.map(f => f.name && f.name !== "image.png" ? f : new File([f], "paste." + ((f.type.split("/")[1] || "png").replace("jpeg", "jpg")), { type: f.type })));
});
let depth = 0;
const hasFiles = e => e.dataTransfer && [...e.dataTransfer.types].includes("Files");
document.addEventListener("dragenter", e => { if (hasFiles(e)) { depth++; document.body.classList.add("drop"); e.preventDefault(); } });
document.addEventListener("dragover", e => { if (hasFiles(e)) e.preventDefault(); });
document.addEventListener("dragleave", e => { if (hasFiles(e) && --depth <= 0) { depth = 0; document.body.classList.remove("drop"); } });
document.addEventListener("drop", e => { if (!hasFiles(e)) return; e.preventDefault(); depth = 0; document.body.classList.remove("drop"); sendFiles([...e.dataTransfer.files]); });
kinds(); drawDetail(); reload();
</script>
</body>
</html>
