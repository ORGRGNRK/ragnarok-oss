# XcodeGen spec for the iPhone/iPad app. The generated PhoneGraderiOS.xcodeproj is committed,
# so you only need XcodeGen (brew install xcodegen) if you change this file:
#   cd iOS && xcodegen generate
#
# Shares code with the Mac app instead of forking it:
#   • PhoneGraderCore  — local Swift package product (../Package.swift)
#   • ../Sources/PhoneGrader — the same SwiftUI views/state as the Mac app; Mac-only parts are
#     behind #if os(macOS) (CLI, USB DeviceReader, NSOpenPanel/NSSavePanel, printing, claude CLI).
name: PhoneGraderiOS
options:
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
packages:
  PhoneGrader:
    path: ..
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: F6GQ67QRFA
    CODE_SIGN_STYLE: Automatic
targets:
  PhoneGraderiOS:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: ../Sources/PhoneGrader
        group: Shared
      - path: ../Resources/rubric.md
        group: Resources
        buildPhase: resources
      - path: ../Resources/atlas-ladder.json
        group: Resources
        buildPhase: resources
      - path: ../Resources/actual-quotes.json
        group: Resources
        buildPhase: resources
      - path: ../Resources/phone.schema.json
        group: Resources
        buildPhase: resources
      - path: Assets.xcassets
      - path: Info.plist
        buildPhase: none
    dependencies:
      - package: PhoneGrader
        product: PhoneGraderCore
    settings:
      base:
        PRODUCT_NAME: PhoneGrader
        PRODUCT_MODULE_NAME: PhoneGraderApp
        PRODUCT_BUNDLE_IDENTIFIER: com.christopher.phonegrader
        INFOPLIST_FILE: Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        MARKETING_VERSION: 1.0.0
        CURRENT_PROJECT_VERSION: 1
        ENABLE_PREVIEWS: YES
schemes:
  PhoneGraderiOS:
    build:
      targets:
        PhoneGraderiOS: all
    run:
      config: Debug
    archive:
      config: Release
