services:
  db:
    image: postgres:16-alpine
    container_name: ragnarok-pipe-db
    restart: always
    env_file:
      - ./db.env
    ports:
      - "127.0.0.1:5544:5432"
    volumes:
      - ragnarok-pipe-pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pipe_admin -d pipe"]
      interval: 5s
      timeout: 3s
      retries: 10

  ollama:
    image: ollama/ollama:latest
    container_name: ragnarok-ollama
    restart: always
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ragnarok-ollama-data:/root/.ollama

volumes:
  ragnarok-pipe-pgdata:
  ragnarok-ollama-data:
