# Vaultwarden: self-hosted Bitwarden-compatible password vault for rgnrk.co.
# Public origin https://vault.example.com (via cloudflared). Loopback only.
# Admin panel is OFF (no ADMIN_TOKEN). Signups CLOSED 2026-11-13 after the owner made their
# account (the owner's). Leave closed. Do NOT re-add SIGNUPS_DOMAINS_WHITELIST:
# it re-opens signups for that domain even with SIGNUPS_ALLOWED false (seen 2026-11-13).
# SSO via Pocket ID (auth.example.com) gets switched on once a client exists there.
services:
  vaultwarden:
    image: vaultwarden/server:1.37.5
    container_name: vaultwarden
    restart: unless-stopped
    user: "1000:1000"
    environment:
      DOMAIN: https://vault.example.com
      ROCKET_PORT: "8080"
      SIGNUPS_ALLOWED: "false"
      INVITATIONS_ALLOWED: "false"
      SHOW_PASSWORD_HINT: "false"
      IP_HEADER: CF-Connecting-IP
    ports:
      - "127.0.0.1:8222:8080"
    volumes:
      - ./data:/data
