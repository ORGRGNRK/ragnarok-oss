# SCRATCH Yggdrasil split rehearsal on the Mac. Separate from ragnarok-shop: own project, names, ports, volumes.
# Secrets come from .env (chmod 600, generated by scripts/gen-env.sh). Ports bind to 127.0.0.1 only.
name: ygg-scratch

services:
  pg:
    image: postgres:17-alpine
    container_name: ygg-scratch-pg
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run scripts/gen-env.sh}
      YGG_APP_PASSWORD: ${YGG_APP_PASSWORD:?}
      YGG_READ_PASSWORD: ${YGG_READ_PASSWORD:?}
      NC_META_PASSWORD: ${NC_META_PASSWORD:?}
    ports:
      - "127.0.0.1:${YGG_PG_PORT:-5547}:5432"
    volumes:
      - ygg_scratch_pgdata:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d:ro
    mem_limit: 768m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 30

  nocodb:
    image: nocodb/nocodb:2026.10.0
    container_name: ygg-scratch-nocodb
    restart: unless-stopped
    depends_on:
      pg:
        condition: service_healthy
    environment:
      NC_DB: "pg://pg:5432?u=nocodb&p=${NC_META_PASSWORD}&d=nocodb_meta"
      NC_AUTH_JWT_SECRET: ${NC_AUTH_JWT_SECRET:?}
      NC_ADMIN_EMAIL: ${NC_ADMIN_EMAIL:?}
      NC_ADMIN_PASSWORD: ${NC_ADMIN_PASSWORD:?}
      NC_DISABLE_TELE: "true"
      NC_ALLOW_LOCAL_EXTERNAL_DBS: "true"
    ports:
      - "127.0.0.1:${YGG_NC_PORT:-8091}:8080"
    volumes:
      - ygg_scratch_ncdata:/usr/app/data
    mem_limit: 1g

volumes:
  ygg_scratch_pgdata:
  ygg_scratch_ncdata:
