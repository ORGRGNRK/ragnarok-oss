# ygg-mcp-business, packaged: Postgres + NocoDB + Business MCP (+ optional Ollama, profile "search").
# One command: ./install.sh   (generates .env, then `docker compose up -d --build`).
# Secrets live only in .env (chmod 600, generated by deploy/scripts/gen-env.sh, git- and docker-ignored).
# The project name comes from COMPOSE_PROJECT_NAME in .env. Every port binds to 127.0.0.1 only.
# Passwords are hex (URL-safe), so they are interpolated straight into the MCP's database URLs.

x-pg-env: &pg-env
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run ./install.sh first}
  APP_OWNER_PASSWORD: ${APP_OWNER_PASSWORD:-${YGG_APP_PASSWORD}}
  APP_READ_PASSWORD: ${APP_READ_PASSWORD:-${YGG_READ_PASSWORD}}
  NC_META_PASSWORD: ${NC_META_PASSWORD:?run ./install.sh first}

services:
  pg:
    image: postgres:17-alpine
    restart: unless-stopped
    environment: *pg-env
    ports:
      - "127.0.0.1:${PLATFORM_PG_PORT:-${YGG_PG_PORT:-5557}}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/initdb:/docker-entrypoint-initdb.d:ro       # roles, DBs, schemas (first boot only)
      - ./deploy/sql:/ygg-sql/platform:ro                    # generic platform tables
      - ./sql:/ygg-sql/mcp:ro                                # schema mcp: receipts, search cache, auth state
    mem_limit: 768m
    healthcheck:
      # 127.0.0.1 (not the socket): stays unhealthy while initdb scripts run on the socket-only server.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 30

  nocodb:
    image: nocodb/nocodb:2026.10.0
    restart: unless-stopped
    depends_on:
      pg:
        condition: service_healthy
    environment:
      NC_DB: "pg://pg:5432?u=nocodb&p=${NC_META_PASSWORD}&d=nocodb_meta"
      NC_AUTH_JWT_SECRET: ${NC_AUTH_JWT_SECRET:?run ./install.sh first}
      NC_ADMIN_EMAIL: ${NC_ADMIN_EMAIL:-admin@localhost.local}
      NC_ADMIN_PASSWORD: ${NC_ADMIN_PASSWORD:?run ./install.sh first}
      NC_DISABLE_TELE: "true"
      NC_ALLOW_LOCAL_EXTERNAL_DBS: "true"
    ports:
      - "127.0.0.1:${PLATFORM_NC_PORT:-${YGG_NC_PORT:-8095}}:8080"
    volumes:
      - ncdata:/usr/app/data
    mem_limit: 1g

  mcp:
    build: .
    image: secure-mcp-platform:${PLATFORM_MCP_TAG:-local}
    restart: unless-stopped
    depends_on:
      pg:
        condition: service_healthy
    environment:
      APP_READ_DATABASE_URL: "postgresql://app_read:${APP_READ_PASSWORD:-${YGG_READ_PASSWORD}}@pg:5432/app_db"
      APP_OWNER_DATABASE_URL: "postgresql://app_owner:${APP_OWNER_PASSWORD:-${YGG_APP_PASSWORD}}@pg:5432/app_db"
      PLATFORM_REQUIRE_AUTH: ${PLATFORM_REQUIRE_AUTH:-true}
      PLATFORM_SESSION_TTL_MINUTES: ${PLATFORM_SESSION_TTL_MINUTES:-60}
      PLATFORM_UNLOCK_SECRET: ${PLATFORM_UNLOCK_SECRET:-}
      PLATFORM_EMBEDDER_URL: ${PLATFORM_EMBEDDER_URL:-http://ollama:11434}
      PLATFORM_EMBEDDER_MODEL: ${PLATFORM_EMBEDDER_MODEL:-nomic-embed-text}
      PLATFORM_HTTP_ALLOWED_HOSTS: "127.0.0.1,localhost"
    ports:
      - "127.0.0.1:${PLATFORM_MCP_HTTP_PORT:-${YGG_MCP_HTTP_PORT:-8787}}:8787"           # Streamable HTTP, POST /mcp
    read_only: true
    tmpfs: [/tmp]
    mem_limit: 256m

  # --- optional semantic search (COMPOSE_PROFILES=search, or ./install.sh --with-search) ---
  ollama:
    image: ollama/ollama:0.40.12
    profiles: [search]
    restart: unless-stopped
    volumes:
      - ollama:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12

  ollama-pull:
    image: ollama/ollama:0.40.12
    profiles: [search]
    restart: "no"
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["ollama", "pull", "${BUSINESS_EMBEDDER_MODEL:-nomic-embed-text}"]

volumes:
  pgdata:
  ncdata:
  ollama:
