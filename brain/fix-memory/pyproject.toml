[project]
name = "fix-memory"
version = "0.1.0"
description = "Build-time self-healing test loop with a local fix memory (Ollama + Postgres/pgvector)."
requires-python = ">=3.11"
dependencies = [
  "psycopg[binary]>=3.2",
]

[project.scripts]
fixloop = "fixloop.cli:main"
fixloop-mcp = "fixloop.mcp_server:main"   # deprecated stub: the tools moved to ragnarok/connector

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["fixloop"]
